worker_processes auto;

events {
  worker_connections 16384;
  multi_accept on;
}

http {

  upstream orders_api {
    server app:8080;
  }

  upstream dashboard_frontend {
    server dashboard:80;
  }

  upstream grafana_upstream {
    server grafana:3000;
  }

  server {
    listen 80;
    server_name localhost;

    # Headers repassados para a API
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts padrão
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ── Orders API ──────────────────────────────────────────
    location /api/ {
      proxy_pass         http://orders_api;
      proxy_read_timeout 60s;
    }

    # ── SSE: HTTP/1.1 obrigatório, sem buffer, sem timeout ──
    location /api/v1/orders/stream {
      proxy_pass             http://orders_api;
      proxy_http_version     1.1;
      proxy_buffering        off;
      proxy_cache            off;
      proxy_read_timeout     3600s;
      proxy_set_header       Connection '';
      proxy_set_header       Host              $host;
      proxy_set_header       X-Real-IP         $remote_addr;
      proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
    }

    location /api/v1/orders/kafka/stream {
      proxy_pass             http://orders_api;
      proxy_http_version     1.1;
      proxy_buffering        off;
      proxy_cache            off;
      proxy_read_timeout     3600s;
      proxy_set_header       Connection '';
      proxy_set_header       Host              $host;
      proxy_set_header       X-Real-IP         $remote_addr;
      proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # ── Swagger UI ──────────────────────────────────────────
    location /swagger-ui/ {
      proxy_pass http://orders_api;
    }

    location /v3/api-docs {
      proxy_pass http://orders_api;
    }

    location /swagger-ui.html {
      proxy_pass http://orders_api;
    }

    # ── Actuator ────────────────────────────────────────────
    location /actuator/ {
      proxy_pass http://orders_api;
    }

    # ── Grafana (sem strip de prefixo — sub-path configurado) ─
    location /grafana/ {
      proxy_pass http://grafana_upstream;
      proxy_set_header Host $host;
    }

    # ── Dashboard (frontend React) ───────────────────────────
    location /dashboard/ {
      proxy_pass http://dashboard_frontend/dashboard/;
    }

    # ── Raiz → dashboard ────────────────────────────────────
    location = / {
      return 301 /dashboard/;
    }

    location / {
      proxy_pass http://orders_api/actuator/health;
    }
  }
}
